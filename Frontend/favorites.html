    <!-- 즐겨찾기 해제 버튼 프론트 동작 -->
    <script>
                document.querySelectorAll('.fav-star-badge').forEach(btn => {
                    btn.addEventListener('click', function () {
                        if (!confirm('이 작품을 즐겨찾기에서 해제하시겠습니까?')) return;

                        // [BACKEND] PHP 연동 시 favorite_delete.php?anime_id=... 호출 또는 form submit 처리
                        const card = this.closest('.fav-card-item');
                        if (card) card.remove();

                        const remaining = document.querySelectorAll('.fav-card-item').length;
                        document.getElementById('fav-count-text').innerHTML =
                            '총 <strong style="color: #ffffff;">' + remaining + '</strong>개 작품';

                        if (remaining === 0) {
                            document.getElementById('fav-empty-box').style.display = 'block';
                        }
                    });
                });
    </script>
